<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calculadora de Divisas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f5f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 12px;
    }

    .app-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 20px 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    /* Pestañas superiores */
    .tabs-container {
      display: flex;
      background-color: #f0f3f7;
      padding: 4px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #5a6878;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background-color: #0d8f58;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(13, 143, 88, 0.3);
    }

    /* Encabezado */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1a2332;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: #7a889b;
    }

    /* Tarjeta de Tasas */
    .rates-card {
      background-color: #f8fafc;
      border: 1px solid #eef2f6;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 20px;
    }

    .rate-box {
      text-align: center;
      flex: 1;
    }

    .rate-divider {
      width: 1px;
      height: 40px;
      background-color: #e2e8f0;
    }

    .rate-title-usd {
      font-size: 13px;
      font-weight: 700;
      color: #0d8f58;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .rate-title-eur {
      font-size: 13px;
      font-weight: 700;
      color: #2563eb;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .rate-value {
      font-size: 20px;
      font-weight: 800;
      color: #1a2332;
    }

    /* Entrada de Monto */
    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #5a6878;
      margin-bottom: 8px;
    }

    .amount-input {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      color: #1a2332;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .amount-input:focus {
      border-color: #0d8f58;
    }

    /* Grilla de Botones */
    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .action-btn {
      padding: 14px 8px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .btn-usd-bs { background-color: #0d8f58; }
    .btn-eur-bs { background-color: #2563eb; }
    .btn-bs-conv { background-color: #1e293b; }

    /* Tarjeta de Resultado */
    .result-card {
      background-color: #eefcf4;
      border: 1px solid #c6f6d5;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
    }

    .result-subtitle {
      font-size: 11px;
      font-weight: 800;
      color: #0d8f58;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 24px;
      font-weight: 800;
      color: #1a2332;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Pestañas Superiores -->
    <div class="tabs-container">
      <button class="tab-btn active" id="tabBcv" onclick="seleccionarModo('bcv')">💵 Tasas BCV</button>
      <button class="tab-btn" id="tabComision" onclick="seleccionarModo('comision')">🏦 Comisión 0.3%</button>
    </div>

    <!-- Título y Fecha -->
    <div class="header">
      <h1>Calculadora de Divisas</h1>
      <p id="lblFecha">Tasas oficiales BCV al: --/--/----</p>
    </div>

    <!-- Cuadro de Tasas Actuales -->
    <div class="rates-card">
      <div class="rate-box">
        <div class="rate-title-usd">DÓLAR (USD)</div>
        <div class="rate-value" id="valUsd">--.-- Bs</div>
      </div>
      <div class="rate-divider"></div>
      <div class="rate-box">
        <div class="rate-title-eur">EURO (EUR)</div>
        <div class="rate-value" id="valEur">--.-- Bs</div>
      </div>
    </div>

    <!-- Campo de Entrada -->
    <div class="input-group">
      <label class="input-label">Monto Neto a Convertir</label>
      <input type="number" id="txtMonto" class="amount-input" value="" placeholder="0.00">
    </div>

    <!-- Botones de Acción -->
    <div class="buttons-grid">
      <button class="action-btn btn-usd-bs" onclick="convertir('USD_BS')">USD a Bs</button>
      <button class="action-btn btn-bs-conv" onclick="convertir('BS_USD')">Bs a USD</button>
      <button class="action-btn btn-eur-bs" onclick="convertir('EUR_BS')">EUR a Bs</button>
      <button class="action-btn btn-bs-conv" onclick="convertir('BS_EUR')">Bs a EUR</button>
    </div>

    <!-- Resultado -->
    <div class="result-card">
      <div class="result-subtitle">CONVERSIÓN INMEDIATA</div>
      <div class="result-value" id="valResultado">0.00 Bs</div>
    </div>

  </div>

  <script>
  // Configuración del Endpoint
  const API_URL = "https://script.google.com/macros/s/AKfycbymLInmOJa9sPeQcZtRb2A-UmUiYyKWRIRdave7HkKBUCtxdXZiwryeRDcPmbPsuSyLaA/exec";

  // Variables de Estado
  let tasaUsd = 784.66;  // Valor de respaldo inicial
  let tasaEur = 916.01;  // Valor de respaldo inicial
  let modoActual = 'bcv';

  // Cargar datos al iniciar
  window.onload = function() {
    const fechaHoy = new Date().toLocaleDateString('es-VE');
    document.getElementById('lblFecha').innerText = `Tasas oficiales BCV al: ${fechaHoy}`;
    
    // Obtener tasas actualizadas desde Google Apps Script
    obtenerTasasDesdeScript();
    
    // Dejar la pantalla en blanco (0.00 Bs) al cargar
    document.getElementById('valResultado').innerText = "0.00 Bs";
  };

  function obtenerTasasDesdeScript() {
    if (API_URL.includes("TU_SCRIPT_ID")) {
      actualizarPantallaTasas();
      return;
    }

    fetch(API_URL)
      .then(response => response.json())
      .then(data => {
        if (data.usd) tasaUsd = parseFloat(data.usd);
        if (data.eur) tasaEur = parseFloat(data.eur);
        if (data.fecha) document.getElementById('lblFecha').innerText = `Tasas oficiales BCV al: ${data.fecha}`;
        actualizarPantallaTasas();
      })
      .catch(error => {
        console.warn("Usando tasas de respaldo por error de conexión:", error);
        actualizarPantallaTasas();
      });
  }

  function actualizarPantallaTasas() {
    const factor = (modoActual === 'comision') ? 1.003 : 1.0;
    document.getElementById('valUsd').innerText = (tasaUsd * factor).toFixed(2) + " Bs";
    document.getElementById('valEur').innerText = (tasaEur * factor).toFixed(2) + " Bs";
  }

  function seleccionarModo(modo) {
    modoActual = modo;
    document.getElementById('tabBcv').classList.toggle('active', modo === 'bcv');
    document.getElementById('tabComision').classList.toggle('active', modo === 'comision');
    actualizarPantallaTasas();
  }

  // Esta función SOLO se ejecuta al hacer clic en uno de los 4 botones
  function convertir(operacion) {
    const monto = parseFloat(document.getElementById('txtMonto').value);

    // Si el usuario no ha escrito nada, mantenemos el resultado en 0.00
    if (isNaN(monto) || monto <= 0) {
      document.getElementById('valResultado').innerText = "0.00 Bs";
      return;
    }

    const factorComision = (modoActual === 'comision') ? 1.003 : 1.0;
    const usdEfectivo = tasaUsd * factorComision;
    const eurEfectivo = tasaEur * factorComision;

    let resultado = 0;
    let moneda = "Bs";

    switch (operacion) {
      case 'USD_BS':
        resultado = monto * usdEfectivo;
        moneda = "Bs";
        break;
      case 'BS_USD':
        resultado = monto / usdEfectivo;
        moneda = "USD";
        break;
      case 'EUR_BS':
        resultado = monto * eurEfectivo;
        moneda = "Bs";
        break;
      case 'BS_EUR':
        resultado = monto / eurEfectivo;
        moneda = "EUR";
        break;
    }

    document.getElementById('valResultado').innerText = `${resultado.toFixed(2)} ${moneda}`;
  }
</script>
</body>
</html>
