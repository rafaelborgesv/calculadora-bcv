<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calculadora de Divisas y Comisión</title>

  <!-- Icono para la pestaña del navegador -->
  <link rel="icon" type="image/png" href="favicon.png">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f5f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 12px;
    }

    .app-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 20px 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    /* Pestañas superiores */
    .tabs-container {
      display: flex;
      background-color: #f0f3f7;
      padding: 4px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #5a6878;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active-bcv {
      background-color: #0d8f58;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(13, 143, 88, 0.3);
    }

    .tab-btn.active-comision {
      background-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
    }

    /* Encabezados */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1a2332;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: #7a889b;
    }

    /* Vista 1: Tasas BCV */
    .rates-card {
      background-color: #f8fafc;
      border: 1px solid #eef2f6;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 20px;
    }

    .rate-box {
      text-align: center;
      flex: 1;
    }

    .rate-divider {
      width: 1px;
      height: 40px;
      background-color: #e2e8f0;
    }

    .rate-title-usd { font-size: 12px; font-weight: 800; color: #0d8f58; margin-bottom: 4px; }
    .rate-title-eur { font-size: 12px; font-weight: 800; color: #2563eb; margin-bottom: 4px; }
    .rate-value { font-size: 20px; font-weight: 800; color: #1a2332; }

    /* Inputs */
    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #5a6878;
      margin-bottom: 8px;
    }

    .amount-input {
      width: 100%;
      padding: 14px 16px;
      background-color: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #1a2332;
      outline: none;
    }

    .amount-input:focus {
      border-color: #2563eb;
    }

    /* Botones */
    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .action-btn {
      padding: 14px 8px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
    }

    .btn-usd-bs { background-color: #0d8f58; }
    .btn-eur-bs { background-color: #2563eb; }
    .btn-bs-conv { background-color: #1e293b; }

    .btn-full-blue {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 20px;
    }

    /* Tarjetas de Resultado */
    .result-card-single {
      background-color: #eefcf4;
      border: 1px solid #c6f6d5;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
    }

    .result-subtitle {
      font-size: 11px;
      font-weight: 800;
      color: #0d8f58;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 24px;
      font-weight: 800;
      color: #1a2332;
    }

    /* Tarjeta Resultado Comisión */
    .result-card-comision {
      background-color: #f0f6ff;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      padding: 16px;
      display: none; /* Oculta por defecto */
    }

    .comision-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }

    .comision-label-blue {
      font-size: 12px;
      font-weight: 800;
      color: #2563eb;
      letter-spacing: 0.5px;
    }

    .comision-label-dark {
      font-size: 12px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.5px;
    }

    .comision-val {
      font-size: 16px;
      font-weight: 800;
      color: #1a2332;
    }

    .comision-divider {
      height: 1px;
      background-color: #dbeafe;
      margin: 8px 0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Pestañas Superiores -->
    <div class="tabs-container">
      <button class="tab-btn active-bcv" id="tabBcv" onclick="mostrarVista('bcv')">💵 Tasas BCV</button>
      <button class="tab-btn" id="tabComision" onclick="mostrarVista('comision')">🏦 Comisión 0.3%</button>
    </div>

    <!-- ================= VISTA 1: TASAS BCV ================= -->
    <div id="vistaBcv">
      <div class="header">
        <h1>Calculadora de Divisas</h1>
        <p id="lblFecha">Tasas oficiales BCV al: --/--/----</p>
      </div>

      <div class="rates-card">
        <div class="rate-box">
          <div class="rate-title-usd">DÓLAR (USD)</div>
          <div class="rate-value" id="valUsd">--.-- Bs</div>
        </div>
        <div class="rate-divider"></div>
        <div class="rate-box">
          <div class="rate-title-eur">EURO (EUR)</div>
          <div class="rate-value" id="valEur">--.-- Bs</div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Monto Neto a Convertir</label>
        <input type="number" id="txtMontoBcv" class="amount-input" value="" placeholder="0.00">
      </div>

      <div class="buttons-grid">
        <button class="action-btn btn-usd-bs" onclick="convertirDivisa('USD_BS')">USD a Bs</button>
        <button class="action-btn btn-bs-conv" onclick="convertirDivisa('BS_USD')">Bs a USD</button>
        <button class="action-btn btn-eur-bs" onclick="convertirDivisa('EUR_BS')">EUR a Bs</button>
        <button class="action-btn btn-bs-conv" onclick="convertirDivisa('BS_EUR')">Bs a EUR</button>
      </div>

      <div class="result-card-single">
        <div class="result-subtitle">CONVERSIÓN INMEDIATA</div>
        <div class="result-value" id="valResultadoBcv">0.00 Bs</div>
      </div>
    </div>

    <!-- ================= VISTA 2: COMISIÓN BANCARIA ================= -->
    <div id="vistaComision" style="display: none;">
      <div class="header">
        <h1>Comisión Bancaria</h1>
        <p>Cálculo plano basado en tarifa de 0.3%</p>
      </div>

      <div class="input-group">
        <label class="input-label">Monto de la Operación</label>
        <input type="number" id="txtMontoComision" class="amount-input" value="" placeholder="Monto transferido">
      </div>

      <button class="btn-full-blue" onclick="calcularComisionBancaria()">Calcular Comisión</button>

      <div class="result-card-comision" id="cardResultadoComision">
        <div class="comision-row">
          <span class="comision-label-blue">COMISIÓN (0.3%):</span>
          <span class="comision-val" id="lblMontoComision">0.00 Bs</span>
        </div>
        <div class="comision-divider"></div>
        <div class="comision-row">
          <span class="comision-label-dark">MONTO TOTAL + COMISIÓN:</span>
          <span class="comision-val" id="lblMontoTotal">0.00 Bs</span>
        </div>
      </div>
    </div>
    
    <!-- Área de Publicidad -->
    <div class="ad-slot" style="text-align: center; margin-top: 15px;">
      <span class="ad-label" style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 5px;">PUBLICIDAD</span>
  
      <iframe 
        src="ad.html" 
        width="320" 
        height="260" 
        frameborder="0" 
        scrolling="no" 
        style="border:none; overflow:hidden;">
      </iframe>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbymLInmOJa9sPeQcZtRb2A-UmUiYyKWRIRdave7HkKBUCtxdXZiwryeRDcPmbPsuSyLaA/exec";

    let tasaUsd = 784.66;
    let tasaEur = 916.01;

    window.onload = function() {
      const fechaHoy = new Date().toLocaleDateString('es-VE');
      document.getElementById('lblFecha').innerText = `Tasas oficiales BCV al: ${fechaHoy}`;
      obtenerTasasDesdeScript();
    };

    function obtenerTasasDesdeScript() {
      if (API_URL.includes("TU_SCRIPT_ID")) return;

      fetch(API_URL)
        .then(response => response.json())
        .then(data => {
          if (data.usd) tasaUsd = parseFloat(data.usd);
          if (data.eur) tasaEur = parseFloat(data.eur);
          if (data.fecha) document.getElementById('lblFecha').innerText = `Tasas oficiales BCV al: ${data.fecha}`;
          document.getElementById('valUsd').innerText = tasaUsd.toFixed(2) + " Bs";
          document.getElementById('valEur').innerText = tasaEur.toFixed(2) + " Bs";
        })
        .catch(error => console.warn("Usando tasas de respaldo:", error));
    }

    // Cambiar entre Pestañas
    function mostrarVista(vista) {
      const tabBcv = document.getElementById('tabBcv');
      const tabComision = document.getElementById('tabComision');
      const vistaBcv = document.getElementById('vistaBcv');
      const vistaComision = document.getElementById('vistaComision');

      if (vista === 'bcv') {
        tabBcv.className = 'tab-btn active-bcv';
        tabComision.className = 'tab-btn';
        vistaBcv.style.display = 'block';
        vistaComision.style.display = 'none';
      } else {
        tabBcv.className = 'tab-btn';
        tabComision.className = 'tab-btn active-comision';
        vistaBcv.style.display = 'none';
        vistaComision.style.display = 'block';
      }
    }

    // Lógica Vista 1: Divisas
    function convertirDivisa(operacion) {
      const monto = parseFloat(document.getElementById('txtMontoBcv').value);

      if (isNaN(monto) || monto <= 0) {
        document.getElementById('valResultadoBcv').innerText = "0.00 Bs";
        return;
      }

      let resultado = 0;
      let moneda = "Bs";

      switch (operacion) {
        case 'USD_BS': resultado = monto * tasaUsd; moneda = "Bs"; break;
        case 'BS_USD': resultado = monto / tasaUsd; moneda = "USD"; break;
        case 'EUR_BS': resultado = monto * tasaEur; moneda = "Bs"; break;
        case 'BS_EUR': resultado = monto / tasaEur; moneda = "EUR"; break;
      }

      document.getElementById('valResultadoBcv').innerText = `${resultado.toFixed(2)} ${moneda}`;
    }

    // Lógica Vista 2: Comisión 0.3% con Mínimo de 14.00 Bs
    function calcularComisionBancaria() {
      const monto = parseFloat(document.getElementById('txtMontoComision').value);
      const cardResultado = document.getElementById('cardResultadoComision');

      if (isNaN(monto) || monto <= 0) {
        cardResultado.style.display = 'none';
        return;
      }

      // Regla: 0.3% o un mínimo absoluto de 14.00 Bs
      let comision = monto * 0.003;
      if (comision < 14) {
        comision = 14.00;
      }

      const total = monto + comision;

      document.getElementById('lblMontoComision').innerText = `${comision.toFixed(2)} Bs`;
      document.getElementById('lblMontoTotal').innerText = `${total.toFixed(2)} Bs`;
      cardResultado.style.display = 'block';
    }
  </script>
</body>
</html>
